<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">YPanel maskable icon</title>
  <desc id="desc">YPanel geometric Y logo on a dark infrastructure background.</desc>
  <defs>
    <radialGradient id="halo" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#03060c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <linearGradient id="pwa-solid-grad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="pwa-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="#03060c"/>
  <rect width="512" height="512" rx="116" fill="url(#halo)"/>
  <g transform="translate(64, 64) scale(8)" filter="url(#pwa-glow)">
    <!-- Single Unified Solid Corporate Geometric Y -->
    <path
      d="M 6 8 H 17 L 24 19.5 L 31 8 H 42 L 28.5 24 V 40 H 19.5 V 24 L 6 8 Z"
      fill="url(#pwa-solid-grad)"
    />
  </g>
</svg>
