name: CI

on:
  push:
    branches: [main-runtime]
  pull_request:
    branches: [main-runtime]
  workflow_dispatch:

jobs:
  backend:
    name: Go — lint, test & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build binary
        run: go build -o /dev/null ./cmd/panel-agent/

  frontend:
    name: Bun — lint, typecheck & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run build:check

      - name: Build
        run: bun run build
