name: Release Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish with release notes, e.g. v3.2.2. Leave empty to only build the artifact.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish-installer:
    name: Build and publish public installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install frontend dependencies
        shell: pwsh
        run: bun install --frozen-lockfile

      - name: Build installer package
        shell: pwsh
        run: .\scripts\package-installer.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: reneo-installer
          path: |
            dist-release/reneo-installer.run
            dist-release/ypanel-installer.run
          if-no-files-found: error

      - name: Build release notes from CHANGELOG.md
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $tag = $env:RELEASE_TAG
          $version = $tag.TrimStart('v')
          $notes = ''
          if (Test-Path CHANGELOG.md) {
            $text = Get-Content CHANGELOG.md -Raw
            $pattern = '(?ms)^## \[' + [regex]::Escape($version) + '\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)'
            $m = [regex]::Match($text, $pattern)
            if ($m.Success) { $notes = $m.Groups[1].Value.Trim() }
          }
          if (-not $notes) { $notes = "Release $tag" }

          $url = "https://github.com/$($env:REPOSITORY)/releases/download/$tag/reneo-installer.run"
          $fence = '```'
          $lines = @(
            $notes,
            '',
            '---',
            '',
            '## Instalasi',
            '',
            "${fence}bash",
            "wget -O reneo-installer.run $url && sudo bash reneo-installer.run",
            $fence,
            '',
            'Pasang ulang di server yang sudah ada diperlakukan sebagai pembaruan: konfigurasi dipertahankan dan service di-restart. Opsi: `--bind`, `--yes`, `--skip-start`, `--help`.'
          )
          Set-Content -Path release-notes.md -Value ($lines -join "`n") -Encoding utf8
          Get-Content release-notes.md

      - name: Publish GitHub release asset
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: |
            dist-release/reneo-installer.run
            dist-release/ypanel-installer.run
          fail_on_unmatched_files: true
          generate_release_notes: false
